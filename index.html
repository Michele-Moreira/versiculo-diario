<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versículo Diário</title>
    <meta name="description" content="Um versículo por dia, pronto pra enviar no WhatsApp.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- App de celular (PWA): ícone na tela inicial, tela cheia e funciona sem internet -->
    <link rel="manifest" href="manifest.json">
    <!-- iPhone: ícone quadrado cheio, sem canto transparente (o próprio iPhone arredonda) -->
    <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
    <!-- Cor da barra do celular: verde escuro no tema claro, quase preto no escuro -->
    <meta name="theme-color" content="#1F4D3A" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F1F18" media="(prefers-color-scheme: dark)">
    <!-- Avisa o navegador que a página tem os dois temas -->
    <meta name="color-scheme" content="light dark">

    <!-- Prévia do link no WhatsApp, Facebook e afins (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://versiculo-diario-three.vercel.app/">
    <meta property="og:title" content="Versículo Diário">
    <meta property="og:description" content="Um versículo por dia, pronto pra enviar no WhatsApp.">
    <meta property="og:image" content="https://versiculo-diario-three.vercel.app/previa.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="pt_BR">

    <!-- Aplica a paleta salva antes de desenhar a página, senão pisca verde antes de trocar -->
    <script>
        try {
            document.documentElement.dataset.paleta = localStorage.getItem("paleta") || "verde";
        } catch (erro) {}
    </script>
    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics: conta visitas e cliques. O async baixa sem travar a página,
         e o dataLayer é uma fila: clique feito antes de o Google carregar fica guardado -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2S1E39N0PS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag("js", new Date());
        gtag("config", "G-2S1E39N0PS");
    </script>
    <script src="versiculos.js" defer></script>
    <script src="imagem.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <time datetime="2026-11-19">19 de novembro de 2026 </time>
        <blockquote>
            <p>Porque eu sei os pensamentos que penso quanto a vós, diz o SENHOR, pensamentos de paz, e não de mal, para vos dar um futuro com esperança.</p>
            <cite>Jeremias 29:11</cite>
        </blockquote>
        <div class="acoes">
            <a href="#" class="botao" id="whatsapp">Enviar no WhatsApp</a>
            <button type="button" id="outro" class="botao botao-secundario">Outro versículo</button>
        </div>
        <a href="https://ebible.org/porbr2018/JER29.htm" target="_blank" class="link-capitulo" id="capitulo">Ler o capítulo</a>
        <div class="paletas" role="group" aria-label="Cor do cartão">
            <button type="button" class="paleta paleta-verde" data-paleta="verde" aria-label="Verde" aria-pressed="true"></button>
            <button type="button" class="paleta paleta-azul" data-paleta="azul" aria-label="Azul" aria-pressed="false"></button>
            <button type="button" class="paleta paleta-lilas" data-paleta="lilas" aria-label="Lilás" aria-pressed="false"></button>
        </div>
    </main>
    <footer>Texto bíblico: <a href="https://ebible.org/porbr2018/copyright.htm">Bíblia Livre</a>, licença CC BY 4.0</footer>
</body>
</html>
